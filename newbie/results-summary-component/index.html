<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
  <main class = "main-block">
    <section class = "result-view-block">
      <div class = "skeleton-result-view-block">
        
      </div>
      <div class = "whose-result-block hidden">

        <h1 class = "whose-result-line-block">
          Your Result
        </h1>
  
        <div class = "result-value-block">
          <p class = "result-value">
            
          </p>
          <p class = "from-maximum-value">
            of 100
          </p>
        </div>

      </div>

      <div class = "assessment-and-higher-than-information-block hidden">
        <p class = "assessment-value">
          Great
        </p>

        <p class = "higher-than-information-block">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>

    </section>
    
    <div class = "summary-block">
      <h2 class = "summary-text">
        Summary
      </h2>
      
      <div class = "skeleton-summary-block">
        
      </div>

      <ul class = "summary-info-block hidden">
        
      </ul>

      <div class = "button-block hidden">
        <button type="button">
          Continue
        </button>
      </div>
    </div>

  
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script type="module" src="src/js/app.js" defer></script>
</body>
</html>
