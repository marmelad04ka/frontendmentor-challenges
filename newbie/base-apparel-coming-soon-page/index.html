<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>

  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>

  <header class="block-1">
    <img src="images/logo.svg" alt="Fashion store logo">
  </header>
  
  <section class="block-2">
    <picture class="hero-image">
      <source media="(max-width: 768px)" srcset="images/hero-mobile.jpg">
      <img src="images/hero-desktop.jpg" alt="A model in an orange shirt" class="block-image">
    </picture>
  </section>

  <section class="block-3">
    <div class="block-text">
      <h1 class="headline" id="main-headline">
        <span class="emphasis">We're</span> 
        <span class="not-amphasis">coming</span>
        <span class="not-amphasis">soon</span>
      </h1>

      <p class="description">
        Hello fellow shoppers! We're currently building our new fashion store. 
        Add your email below to stay up-to-date with announcements and our launch deals.
      </p>
    </div>
  
    <form novalidate>
      <div class="email-form">
        <label for="email" class="visually-hidden">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email Address"
          autocomplete="email"
          aria-describedby="email-error"
          aria-invalid="false"
          required
        >
        <p class="error hidden" id="email-error" role="alert">Please provide a valid email</p>
        <div class="input-right">
          <img src="images/icon-error.svg" class="error-image hidden" alt="" aria-hidden="true">
          <button class="confirm-button" type="submit">
            <img src="images/icon-arrow.svg" alt="" aria-hidden="true">
            <span class="visually-hidden">Submit email</span>
          </button>
        </div>
      </div>
    </form>
  </section>

  <footer class="attribution block-4">
    <p>
      Challenge by 
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
      Coded by 
      <a href="https://www.frontendmentor.io/profile/marmelad04ka" target="_blank" rel="noopener noreferrer">marmelad04ka</a>.
    </p>
  </footer>
  <script type="module" src="src/js/app.js" defer></script>
</body>
</html>
