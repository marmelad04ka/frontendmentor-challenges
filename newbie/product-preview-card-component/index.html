<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
  <article class="main-block">
    <div class="image-block">
      
    </div>

    <div class="information-block">

      <div class="item-type" aria-label="Product category">
        PERFUME
      </div>

      <h1 class="item-name">
        Gabrielle Essence Eau De Parfum
      </h1>

      <p class="item-description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="item-price">
        <span class="visually-hidden">Current price:</span>
        <strong class="item-price-current">
          $149.99
        </strong>

        <span class="visually-hidden">Old price:</span>
        <del class="item-price-old">
          $169.99
        </del>
      </div>

      <button class="button-cart" type="button">
          <img src="images/icon-cart.svg" alt="" aria-hidden="true">
          <span>Add to Cart</span>
        </button>
    </div>
  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
