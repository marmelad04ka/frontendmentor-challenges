<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>
  
  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
  <main>
  <article class="nft-card-block">
    <figure class="image-nft">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium">
    </figure>

    <div class="info-card-nft">
      <div class="name-nft">
        Equilibrium #3429
      </div>
      
      <p class="description-nft">
        Our Equilibrium collection promotes balance and calm.
      </p>
      
      <div class="another-info-nft">
        <div class="price-nft">
          <div class="image-currency-nft">
            <img src="images/icon-ethereum.svg" alt="">
          </div>
          
          <div class="quantity-currency-nft">
            0.041 ETH
          </div>
        </div>
        
        <div class="lifetime-nft">
          <div class="image-clock-lifetime">
            <img src="images/icon-clock.svg" alt="">
          </div>
          
          <time class="quantity-lifetime" datetime="P3D">
            3 days left
          </time>
        </div>
      </div>
      
      <div class="separator">
        
      </div>

      <footer class="user-creator-nft">
        <div class="user-avatar-img">
          <img src="images/image-avatar.png" alt="Jules Wyvern">
        </div>
        
        <div class="user-name">
          Creation of <span>Jules Wyvern</span>
        </div>
      </footer>
    </div>
  </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
